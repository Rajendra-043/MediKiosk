{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}MediKiosk{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mediblue: '#2563EB',
                        medigreen: '#16A34A',
                        darkblue: '#0F172A'
                    }
                }
            }
        }
    </script>

    <!-- Main CSS -->
    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    <!-- Page Specific CSS -->
    {% block extra_css %}
    {% endblock %}

</head>

<body class="bg-slate-50 text-slate-800">

    {% block content %}
    {% endblock %}


    <!-- Main JavaScript -->
    <script src="{% static 'js/main.js' %}"></script>

    <!-- Page Specific JavaScript -->
    {% block extra_js %}
    {% endblock %}

</body>
</html>
