{% extends "base.html" %}

{% block title %}Patient Login - MediKiosk{% endblock %}

{% block content %}

<div class="min-h-screen
            bg-blue-50
            flex items-center
            justify-center
            px-5 py-10">

    <div class="w-full max-w-md">

        <!-- LOGO -->
        <div class="text-center mb-8">

            <div class="inline-flex
                        w-14 h-14
                        rounded-xl
                        bg-blue-600
                        text-white
                        items-center
                        justify-center
                        font-bold text-xl">

                M
            </div>

            <h1 class="text-3xl
                       font-bold
                       text-slate-900 mt-4">

                Patient Login
            </h1>

            <p class="text-slate-500 mt-2">
                Welcome back to MediKiosk
            </p>

        </div>


        <!-- CARD -->
        <div class="bg-white
                    rounded-3xl
                    shadow-xl
                    border border-slate-200
                    p-8">

            <form id="patientLoginForm"
                  onsubmit="handleLogin(event)">

                <!-- PATIENT ID -->
                <div class="mb-5">

                    <label class="block
                                  text-sm
                                  font-semibold
                                  text-slate-700
                                  mb-2">

                        Patient ID
                    </label>

                    <input type="text"
                           id="patientId"
                           placeholder="Enter your Patient ID"
                           required
                           class="form-input">

                </div>


                <!-- PASSWORD -->
                <div class="mb-5">

                    <label class="block
                                  text-sm
                                  font-semibold
                                  text-slate-700
                                  mb-2">

                        Password
                    </label>

                    <div class="relative">

                        <input type="password"
                               id="patientPassword"
                               placeholder="Enter your password"
                               required
                               class="form-input pr-12">

                        <button type="button"
                                onclick="togglePassword('patientPassword')"
                                class="absolute right-4 top-3
                                       text-slate-400">

                            👁
                        </button>

                    </div>

                </div>


                <!-- REMEMBER -->
                <div class="flex items-center
                            justify-between
                            mb-6">

                    <label class="flex items-center gap-2
                                  text-sm text-slate-600">

                        <input type="checkbox"
                               class="rounded">

                        Remember me
                    </label>

                    <a href="#"
                       class="text-sm
                              text-blue-600
                              hover:underline">

                        Forgot password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->
                <button type="submit"
                        class="w-full
                               bg-blue-600
                               hover:bg-blue-700
                               text-white
                               py-3.5
                               rounded-xl
                               font-semibold
                               transition">

                    Login
                </button>

            </form>


            <!-- REGISTER -->
            <div class="text-center
                        border-t
                        border-slate-200
                        mt-7 pt-6">

                <p class="text-sm
                          text-slate-500">

                    New to MediKiosk?

                    <a href="/patient/register/"
                       class="text-blue-600
                              font-semibold
                              hover:underline">

                        Create an account
                    </a>

                </p>

            </div>

        </div>


        <div class="text-center mt-6">

            <a href="/patient/"
               class="text-sm
                      text-slate-500
                      hover:text-blue-600">

                ← Back
            </a>

        </div>

    </div>

</div>

{% endblock %}
